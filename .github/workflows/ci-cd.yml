name: Forkline backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test
        
  docker-build-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out repository code 
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: set_tag
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check out repository code 
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        run: |
          docker build -t forkline:${{ steps.set_tag.outputs.sha_tag }} .
          docker tag forkline:${{ steps.set_tag.outputs.sha_tag }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/forkline:${{ steps.set_tag.outputs.sha_tag }}
        
      - name: Push to AWS ECR
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/forkline:${{ steps.set_tag.outputs.sha_tag }}

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TAG: ${{ steps.set_tag.outputs.sha_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: AWS_REGION,AWS_ACCOUNT_ID,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TAG
          script: |
            # Install AWS-CLI in the remote pc 
            #   { 
            #     curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            #     unzip awscliv2.zip
            #     sudo ./aws/install
            #   }
            # give docker parmision to the user as cmd 
            #   { 
            #     sudo usermod -aG docker $USER 
            #   }
            REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
            
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            aws ecr get-login-password \
              --region $AWS_REGION | \
            docker login \
              --username AWS \
              --password-stdin $REGISTRY
            
            docker pull $REGISTRY/forkline:$TAG
            docker stop forkline-api-server || true
            docker rm forkline-api-server || true

            docker run -d \
              --name forkline-api-server \
              --restart unless-stopped \
              -p 9000:9000 \
              --env-file /home/${{ secrets.SSH_USER }}/Forkline/.env \
              $REGISTRY/forkline:$TAG

            # Clean up old unused images to save disk space
            docker image prune -af



        
        















